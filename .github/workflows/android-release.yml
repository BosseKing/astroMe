name: Android APK

# Compile l'APK Android et le publie dans une Release GitHub.
# La page de téléchargement pointe vers releases/latest/download/AstroMe.apk.
on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v4

      - run: npm ci

      - name: Générer le projet natif
        run: npx expo prebuild --platform android --no-install
        env:
          CI: 1

      - name: Compiler l'APK release
        working-directory: android
        run: ./gradlew assembleRelease --no-daemon -PreactNativeArchitectures=arm64-v8a,armeabi-v7a

      - name: Renommer l'APK
        run: cp android/app/build/outputs/apk/release/app-release.apk AstroMe.apk

      - name: Publier la Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ startsWith(github.ref, 'refs/tags/') && github.ref_name || format('v{0}', github.run_number) }}
          name: AstroMe ${{ startsWith(github.ref, 'refs/tags/') && github.ref_name || format('build {0}', github.run_number) }}
          make_latest: true
          files: AstroMe.apk
          body: |
            APK Android d'AstroMe.
            Téléchargez `AstroMe.apk` sur votre téléphone puis ouvrez-le pour l'installer.
